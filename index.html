<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0; url=./public/index.html">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EESA • DYPSEM (Redirecting)</title>
  <script>
    window.location.replace("./public/index.html");
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07101f;
      --surface: #0b172a;
      --gold: #f5a623;
      --text: #f5f7fb;
      --muted: #91a0b6;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .redirect-card {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 18px;
      padding: 32px 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold), #d88208);
      color: #111;
      font-weight: 900;
      font-size: 24px;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }
    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 20px;
    }
    a.btn {
      display: inline-block;
      padding: 10px 18px;
      background: linear-gradient(135deg, #ffc85a, var(--gold));
      color: #10151c;
      font-weight: 700;
      text-decoration: none;
      border-radius: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="brand-mark">E</div>
    <h1>EESA Association • DYPSEM</h1>
    <p>Redirecting to the public portal... If your browser doesn't redirect automatically, click below:</p>
    <a class="btn" href="./public/index.html">Open EESA Portal →</a>
  </div>
</body>
</html>
